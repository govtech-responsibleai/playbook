      - Papers and external tools: resources.md
      - Our Work: our-work/index.md
      - Contributing: getting-started/contributing.md
      - Page standards: contributing/page-standards.md
plugins:
  - search
  - section-index
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      strict: false
  - exclude:
      glob:
        - "*.tmp"
        - "*.bak"
  - macros

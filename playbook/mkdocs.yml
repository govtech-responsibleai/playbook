# Project Information
site_name: Responsible AI Playbook
site_description: A technical playbook for evaluating, testing, and mitigating risks in AI systems
site_author: GovTech Singapore AI Practice
docs_dir: docs

# Theme Configuration
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.top
    - content.last_updated

# Extra Configuration
extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:aipractice@tech.gov.sg
    - icon: simple/medium
      link: https://medium.com/dsaid-govtech
    - icon: simple/huggingface
      link: https://huggingface.co/govtech
    - icon: fontawesome/brands/github
      link: https://github.com/orgs/govtech-responsibleai/
    - icon: material/web
      link: https://www.tech.gov.sg
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/govtech-singapore
    - icon: fontawesome/brands/twitter
      link: https://x.com/GovTechSG
  analytics:
    provider: google
    property: G-D8325S860G
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="https://forms.gle/v8bB9pNAARDctmpT6" target="_blank" rel="noopener">feedback form</a>.
copyright: Copyright &copy; 2025 - 2026 Government Technology Agency of Singapore
extra_css:
  - stylesheets/home.css
  - stylesheets/typography.css
extra_javascript:
  - javascripts/home-page.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Project Information
site_name: Responsible AI Playbook
site_description: A playbook for Responsible AI in the Singapore Public Service
site_author: GovTech Singapore AI Practice
docs_dir: docs

# Theme Configuration
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.top
    - content.last_updated 

# Extra Configuration
extra:
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:aipractice@tech.gov.sg
    - icon: simple/medium
      link: https://medium.com/dsaid-govtech
    - icon: simple/huggingface
      link: https://huggingface.co/govtech
    - icon: fontawesome/brands/github
      link: https://github.com/orgs/govtech-responsibleai/
    - icon: material/web
      link: https://www.tech.gov.sg
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/govtech-singapore
    - icon: fontawesome/brands/twitter
      link: https://x.com/GovTechSG

  analytics:
    provider: google
    property: G-D8325S860G
    feedback: 
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve this page by
            using our <a href="https://forms.gle/v8bB9pNAARDctmpT6" target="_blank" rel="noopener">feedback form</a>.
copyright: Copyright &copy; 2025 - 2026 Government Technology Agency of Singapore
  
extra_css:
  - stylesheets/home.css
  - stylesheets/typography.css
extra_javascript:
  - javascripts/home-page.js
# Markdown Extensions
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
    
# Navigation
nav:
  - Home: index.md
  - Getting Started:
      - About this playbook: getting-started/about.md
      - What is Responsible AI: getting-started/responsibleai.md
      - Contributing: getting-started/contributing.md
  - Testing: 
      - Introduction: testing.md
      - Fairness:
          - Discriminative: testing/fairness_testing/fairness_discriminative.md
          - Generative: testing/fairness_testing/fairness_generative.md
      - Safety:
          - Introduction: testing/safety_testing/safety_testing.md
          - Benchmarks and Tools: testing/safety_testing/diff_safety.md
          - Taxonomy: testing/safety_testing/taxonomy.md
          - GovTech Benchmarks: testing/safety_testing/govtech.md
      - Robustness:
          - Introduction: testing/robustness_testing/robustness_testing.md
      - Agentic AI:
          - Introduction: testing/agentic_testing/agentic_testing.md
      - Litmus: testing/litmus.md
  - Guardrails:
      - Introduction: guardrails.md
      - Quick Start: guardrails/quick_start.md
      - Sentinel: guardrails/sentinel.md
      - Different Types of Guardrails: guardrails/diff_guardrails.md
      - Best Practices When Integrating Guardrails: guardrails/best_practices.md
      - Building Your Own Guardrails: guardrails/byog.md
      - GovTech Guardrails: guardrails/govtech.md
  - Resources: resources.md
  - Our Work: our-work/index.md

# Plugins
plugins:
  # - d2:
  #     theme: 0
  #     dark_theme: -1
  #     pad: 20
  - search
  - section-index
  - git-revision-date-localized:
      type: date  # or datetime if you want the time too
      fallback_to_build_date: true
      strict: false
  - exclude:
      glob:
        - "*.tmp"
        - "*.bak"
  - macros
